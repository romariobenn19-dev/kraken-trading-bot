name: 24/7 Crypto Bot Runner

on:
  schedule:
    # 2 minutes past every hour. GitHub can delay scheduled runs by several
    # minutes; the bot only uses closed candles, so that is fine.
    - cron: '2 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual run: normal run, or verify the Kraken keys and stop-order syntax'
        type: choice
        default: run
        options:
          - run
          - check-live

permissions:
  contents: write

# Never run two bot jobs at once.
concurrency:
  group: bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Trading Check
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_PRIVATE_KEY: ${{ secrets.KRAKEN_PRIVATE_KEY }}
          ACTION: ${{ inputs.action }}
          # Repo variables (Settings > Secrets and variables > Actions > Variables).
          # LIVE_TRADING: set to true for real money; anything else = paper.
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          # FEE_RATE: your Kraken taker fee as a decimal, e.g. 0.0040 for 0.40%.
          # Leave unset to use the default in strategy.py.
          FEE_RATE: ${{ vars.FEE_RATE }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          FEE_ARGS=()
          if [ -n "$FEE_RATE" ]; then
            FEE_ARGS=(--fee "$FEE_RATE")
          fi
          if [ "$ACTION" = "check-live" ]; then
            python kraken_bot.py --check-live "${FEE_ARGS[@]}"
          elif [ "$LIVE_TRADING" = "true" ]; then
            # Live state (positions, balances, trades) is committed to this
            # repo, so never trade live from a public repository.
            if [ "$(gh api "repos/$REPO" --jq .private)" != "true" ]; then
              echo "::error::LIVE_TRADING is true but this repository is not private. Make it private first."
              exit 1
            fi
            python kraken_bot.py --live --i-understand-the-risks "${FEE_ARGS[@]}"
          else
            python kraken_bot.py "${FEE_ARGS[@]}"
          fi

      # always(): save state even if the bot step failed part-way. In live mode
      # a lost state file would leave a real position (and its stop order) that
      # the bot no longer knows about.
      - name: Commit and Push State Memory
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for f in bot_state_paper.json bot_state_live.json trades_paper.csv trades_live.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git commit -m "Save bot state and trades [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
